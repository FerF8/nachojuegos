<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Nacho</title>
<meta name="description" content="El juego de Nacho: un mundo de bloques infinito en 3D con ciudad, central nuclear, Tokio y todos los países. Criá a tu kaiju, derrotá jefes y jugá con amigos. Gratis.">
<meta property="og:title" content="Dragon Nacho">
<meta property="og:description" content="El juego de Nacho: construí, criá tu kaiju, viajá por todos los países y jugá con amigos. Gratis, en el navegador.">
<meta property="og:image" content="https://ferf8.github.io/nachojuegos/juego/portada.jpg">
<meta property="og:url" content="https://ferf8.github.io/nachojuegos/juego/">
<link rel="icon" type="image/png" href="../icono_quieto.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
  /* Un solo look a propósito: pantalla de juego oscura, con el amarillo y el diamante de la portada */
  :root {
    --bg: #0A0D24;
    --panel: #121633;
    --panel2: #1C2150;
    --ink: #F1F3FF;
    --muted: #AAB1DB;
    --line: #4A5296;
    --borde: #05061A;
    --oro: #FFD23F;
    --diamante: #3EE6E0;
    --peligro: #FF6B6B;
    --ok: #7CFF6B;
    --display: "Bungee", "Arial Black", Impact, system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--diamante); outline-offset: 2px; }
  #juego { position: fixed; inset: 0; }
  #juego canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .boton {
    font-family: var(--display); font-size: 1rem; letter-spacing: .02em; cursor: pointer; text-decoration: none; display: inline-block;
    background: var(--panel2); color: var(--ink); border: 3px solid var(--borde); border-radius: 6px; padding: 10px 16px;
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .35), inset 0 3px 0 rgba(255, 255, 255, .12);
  }
  .boton:hover { filter: brightness(1.15); }
  .boton:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .35); }
  .boton:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
  .boton.grande { background: var(--oro); color: #1A1200; font-size: 1.35rem; padding: 14px 22px; }
  .boton.chico { font-size: .82rem; padding: 8px 12px; }
  .boton.peligro { background: #7A1F1F; }
  .moneda { display: inline-block; width: 14px; height: 14px; background: var(--oro); border: 2px solid #8A5A00; border-radius: 50%; box-shadow: inset -2px -2px 0 #E0A800; vertical-align: -2px; }
  .error { color: var(--peligro); font-weight: 700; min-height: 1.2em; }

  /* Portada */
  .portada {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 28px; align-items: center; align-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .portada-img { display: flex; justify-content: flex-end; min-width: 0; }
  .portada-img img { width: auto; max-width: 100%; max-height: calc(100vh - 48px); border: 4px solid var(--borde); border-radius: 10px; box-shadow: 8px 8px 0 var(--diamante); }
  .portada-menu { display: grid; gap: 12px; max-width: 420px; min-width: 0; }
  .titulo { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 5vw, 3rem); line-height: .95; color: var(--oro); text-shadow: 3px 3px 0 #7A4A00, 5px 5px 0 var(--borde); }
  .sub { color: var(--muted); }
  .modos { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; min-width: 0; }
  .modos legend { font-family: var(--display); font-size: .85rem; color: var(--diamante); margin-bottom: 6px; padding: 0; }
  .modo-op input { position: absolute; opacity: 0; pointer-events: none; }
  .modo-op label { display: grid; gap: 1px; padding: 7px 12px; background: var(--panel); border: 3px solid var(--line); border-radius: 8px; cursor: pointer; }
  .modo-op label b { font-family: var(--display); font-weight: 400; font-size: .92rem; }
  .modo-op label span { color: var(--muted); font-size: .84rem; }
  .modo-op input:checked + label { border-color: var(--oro); background: var(--panel2); }
  .modo-op input:focus-visible + label { outline: 3px solid var(--diamante); outline-offset: 2px; }
  .candado { font-family: var(--body); font-size: .7rem; color: var(--oro); border: 1px solid var(--oro); border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
  .clave { display: grid; gap: 6px; }
  .clave label { font-weight: 700; }
  .fila { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
  .volver { color: var(--muted); font-size: .9rem; }

  /* HUD */
  #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .hud-izq {
    position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px));
    display: flex; gap: 10px; align-items: center; background: rgba(10, 13, 36, .75); border: 2px solid var(--borde); border-radius: 10px; padding: 5px 12px 5px 5px;
  }
  .hud-izq img { width: 42px; height: 42px; image-rendering: pixelated; }
  .hud-izq b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .hud-izq small { display: block; color: var(--muted); font-size: .75rem; }
  #hud-sitio { position: absolute; top: calc(68px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); background: rgba(10, 13, 36, .75); border: 2px solid var(--borde); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: .85rem; color: var(--diamante); }
  .hud-der { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 62vw; pointer-events: auto; }
  .hud-der .boton { font-size: .75rem; padding: 7px 10px; }
  .hud-der kbd { font-family: var(--body); color: var(--muted); font-size: .7rem; margin-left: 4px; background: none; border: 0; padding: 0; }
  #jefe-barra { position: absolute; top: calc(66px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(420px, 60vw); text-align: center; display: grid; gap: 4px; }
  #jefe-barra b { font-family: var(--display); font-weight: 400; text-shadow: 2px 2px 0 #000; }
  .barra { height: 12px; background: #2A0A0A; border: 2px solid var(--borde); border-radius: 3px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 100%; background: #E5483E; box-shadow: inset 0 3px 0 #FF8A80; }
  #avisos { position: absolute; top: calc(118px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(92vw, 520px); display: grid; gap: 6px; justify-items: center; }
  .aviso { background: rgba(10, 13, 36, .88); border: 2px solid var(--oro); border-radius: 8px; padding: 6px 12px; font-weight: 700; text-align: center; }
  #chat { position: absolute; top: calc(104px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); width: min(360px, 62vw); display: grid; gap: 4px; }
  #chat-log { display: grid; gap: 3px; }
  .msg-chat { background: rgba(10, 13, 36, .74); border-radius: 6px; padding: 3px 8px; font-size: .88rem; overflow-wrap: anywhere; transition: opacity .6s; }
  .msg-chat b { color: var(--oro); }
  .msg-chat.viejo { opacity: 0; }
  #chat.abierto .msg-chat { opacity: 1; }
  #chat-form { display: flex; gap: 6px; pointer-events: auto; }
  #chat-form input { flex: 1; min-width: 0; }
  #mira { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); mix-blend-mode: difference; }
  #mira::before, #mira::after { content: ""; position: absolute; background: #fff; }
  #mira::before { left: 9px; top: 0; width: 2px; height: 20px; }
  #mira::after { top: 9px; left: 0; height: 2px; width: 20px; }
  #progreso { position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); width: 60px; height: 6px; background: rgba(0, 0, 0, .55); border-radius: 3px; overflow: hidden; }
  #progreso i { display: block; height: 100%; width: 0; background: #fff; }
  .abajo { position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 5px; justify-items: center; }
  #nombre-ranura { font-weight: 700; text-shadow: 2px 2px 0 #000; min-height: 1.3em; transition: opacity .4s; }
  #corazones { display: flex; gap: 2px; }
  #corazones svg { width: 18px; height: 16px; }
  .lleno { fill: #FF3B3B; } .medio { fill: #A8323A; } .vacio { fill: #2A2238; }
  #barra-items { display: flex; gap: 3px; background: rgba(10, 13, 36, .78); border: 2px solid var(--borde); border-radius: 8px; padding: 4px; pointer-events: auto; }
  .ranura { position: relative; width: 44px; height: 44px; padding: 0; cursor: pointer; background: rgba(255, 255, 255, .06); border: 2px solid rgba(255, 255, 255, .15); border-radius: 4px; }
  .ranura img { display: block; width: 28px; height: 28px; margin: 6px; image-rendering: pixelated; }
  .ranura span { position: absolute; right: 3px; bottom: 1px; font-size: .72rem; font-weight: 700; text-shadow: 1px 1px 0 #000; }
  .ranura kbd { position: absolute; left: 3px; top: 0; font-family: var(--body); font-size: .6rem; color: var(--muted); background: none; border: 0; padding: 0; }
  .ranura.activa { border-color: #fff; background: rgba(255, 255, 255, .22); }
  .ranura.vacia img { opacity: .35; }
  #dano { position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .25s; background: radial-gradient(transparent 45%, rgba(255, 0, 0, .5)); }
  #clic {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; cursor: pointer;
    font-family: var(--display); font-size: 1.1rem; background: rgba(10, 13, 36, .9); color: var(--oro); border: 3px solid var(--borde); border-radius: 10px; padding: 16px 22px;
  }
  #cargando { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: var(--bg); font-family: var(--display); color: var(--oro); font-size: 1.4rem; }

  /* Controles táctiles */
  #tactil { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .3); }
  #stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, .45); }
  .t-der { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 66px); gap: 10px; pointer-events: auto; }
  .tb { width: 66px; height: 66px; border-radius: 50%; background: rgba(10, 13, 36, .55); border: 2px solid rgba(255, 255, 255, .4); color: #fff; font: 700 .74rem var(--body); touch-action: none; user-select: none; -webkit-user-select: none; }
  .tb.chico { height: 42px; border-radius: 21px; }

  /* Paneles */
  .panel-fondo {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(5, 6, 26, .62);
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .panel { width: min(620px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 4px solid var(--borde); border-radius: 12px; box-shadow: 6px 6px 0 var(--diamante); }
  .panel-cab { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel2); border-bottom: 3px solid var(--borde); }
  .panel-cab h2 { font-family: var(--display); font-weight: 400; font-size: 1.25rem; color: var(--oro); }
  .x { margin-left: auto; flex: none; width: 38px; height: 38px; cursor: pointer; background: transparent; border: 2px solid var(--line); border-radius: 8px; font-size: 1.3rem; line-height: 1; }
  .panel-cuerpo { padding: 16px; display: grid; gap: 12px; }
  .panel-cuerpo h3 { font-family: var(--display); font-weight: 400; font-size: .95rem; color: var(--diamante); margin-top: 4px; }
  .lista { display: grid; gap: 8px; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .item > div { min-width: 0; display: grid; gap: 2px; }
  .item p { color: var(--muted); font-size: .9rem; }
  .item .boton { flex: none; }
  .nota { color: var(--muted); font-size: .85rem; }
  .estado { color: var(--ok); font-size: .9rem; min-height: 1.2em; }
  .tag { font-size: .7rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: #123D24; color: var(--ok); vertical-align: 2px; }
  .botones-col { display: grid; gap: 8px; }
  .botones-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { cursor: pointer; padding: 6px 12px; border-radius: 999px; background: var(--panel2); border: 2px solid var(--line); font-weight: 700; font-size: .88rem; }
  .chip.activo { border-color: var(--oro); color: var(--oro); }
  .trajes, .bloques { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .traje { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; cursor: pointer; background: var(--panel2); border: 3px solid var(--line); border-radius: 8px; font-size: .78rem; font-weight: 700; text-align: center; line-height: 1.15; }
  .traje img { width: 48px; height: 48px; image-rendering: pixelated; border-radius: 4px; }
  .traje.activo { border-color: var(--oro); color: var(--oro); }
  .sala b { font-family: var(--display); font-weight: 400; font-size: 1.7rem; color: var(--oro); letter-spacing: .12em; }
  .teclas { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  kbd { font-family: var(--body); font-size: .8rem; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .campo { display: grid; gap: 4px; font-weight: 700; font-size: .88rem; }
  .taller { display: grid; gap: 10px; }
  .taller label { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
  .taller fieldset { border: 0; padding: 0; margin: 0; }
  .taller fieldset label { display: flex; gap: 6px; align-items: center; font-weight: 400; }
  input[type="text"], input[type="password"], input[type="number"], select, textarea {
    font: 1rem var(--body); color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; box-sizing: border-box;
  }
  input[type="number"] { width: 150px; font-variant-numeric: tabular-nums; }
  input[type="color"] { width: 64px; height: 36px; padding: 0; border: 2px solid var(--line); border-radius: 8px; background: none; }
  input[type="range"] { accent-color: var(--oro); }
  textarea { width: 100%; min-height: 110px; resize: vertical; }

  @media (max-width: 760px) {
    .portada { grid-template-columns: minmax(0, 1fr); align-items: start; align-content: start; justify-items: center; }
    .portada-img { justify-content: center; }
    .portada-img img { max-height: 40vh; }
  }
  @media (max-width: 560px) {
    .ranura { width: 33px; height: 33px; }
    .ranura img { width: 21px; height: 21px; margin: 4px; }
    .ranura kbd { display: none; }
    .hud-der .boton kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .boton:active { transform: none; }
  }
</style>
</head>
<body>
<div id="juego"></div>

<div id="portada" class="portada">
  <div class="portada-img"><img src="portada.jpg" width="720" height="791" alt="Nacho con armadura de diamante, parado sobre bloques de diamante"></div>
  <div class="portada-menu">
    <h1 class="titulo">Dragon<br>Nacho</h1>
    <p class="sub">El juego de Nacho: construí, criá a tu kaiju Gigarex, derrotá jefes gigantes y viajá por todos los países del mundo.</p>
    <p><span class="moneda"></span> Tenés <b id="p-monedas">1000</b> monedas</p>
    <fieldset class="modos" id="modos"><legend>Modo de juego</legend></fieldset>
    <div id="clave-zona" class="clave" hidden>
      <label for="clave">Contraseña del creador</label>
      <input id="clave" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
      <p id="clave-error" class="error" aria-live="polite"></p>
    </div>
    <button id="jugar" class="boton grande" type="button">Jugar</button>
    <div class="fila">
      <button id="ver-ayuda" class="boton chico" type="button">Cómo se juega</button>
      <button id="ver-reportar" class="boton chico" type="button">Reportar un problema</button>
    </div>
    <a class="volver" href="../">← Volver a NachoJuegos</a>
  </div>
</div>

<div id="cargando" hidden>Armando el mundo…</div>

<div id="hud" hidden>
  <div class="hud-izq"><img id="hud-cara" alt=""><div><b><span class="moneda"></span> <span id="hud-monedas">0</span></b><small id="hud-modo"></small></div></div>
  <div id="hud-sitio" hidden></div>
  <div class="hud-der" id="hud-botones"></div>
  <div id="jefe-barra" hidden><b id="jefe-nombre"></b><div class="barra"><i id="jefe-vida"></i></div></div>
  <div id="avisos" aria-live="polite"></div>
  <div id="chat" hidden>
    <div id="chat-log" aria-live="polite"></div>
    <form id="chat-form" hidden><input id="chat-txt" type="text" maxlength="120" autocomplete="off" placeholder="Escribí y apretá Enter" aria-label="Mensaje para tus amigos"><button class="boton chico" type="submit">Enviar</button></form>
  </div>
  <div id="mira"></div>
  <div id="progreso" hidden><i></i></div>
  <div class="abajo">
    <div id="nombre-ranura"></div>
    <div id="corazones" aria-label="Vida"></div>
    <div id="barra-items"></div>
  </div>
</div>
<div id="dano"></div>
<button id="clic" type="button" hidden>Hacé clic para seguir jugando</button>

<div id="tactil" hidden>
  <div id="stick" hidden><i></i></div>
  <div class="t-der">
    <button class="tb" id="tb-romper" type="button">Romper</button>
    <button class="tb" id="tb-poner" type="button">Poner</button>
    <button class="tb" id="tb-bajar" type="button">Bajar</button>
    <button class="tb" id="tb-saltar" type="button">Saltar</button>
    <button class="tb chico" id="tb-volar" type="button">Volar</button>
    <button class="tb chico" id="tb-vista" type="button">Vista</button>
  </div>
</div>

<div id="panel" class="panel-fondo" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo">
    <div class="panel-cab"><h2 id="panel-titulo"></h2><button id="panel-cerrar" class="x" type="button" aria-label="Cerrar">×</button></div>
    <div id="panel-cuerpo" class="panel-cuerpo"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ================== Configuración ==================
// Cuando exista el servidor de Discord, pegá acá el link de invitación (por ejemplo "https://discord.gg/abc123")
const DISCORD_URL = "";
// Contraseña de los modos del creador (Admin, Creador y Nacho).
// Ojo: queda a la vista en el código de la página. Es un candado para chicos, no una seguridad real.

const multi = { peer: null, host: false, conns: new Map(), codigo: "", otros: new Map(), estado: "", enviarT: 0, ultimoChat: 0 };

    "browser-incompatible": "Este navegador no permite jugar con amigos. Probá con Chrome o Edge.",
    "network": "No se pudo conectar. Revisá internet.", "server-error": "El servicio para conectar no responde. Probá en un rato.",

  const peer = new Peer(PREFIJO_SALA + codigo);

    multi.conns.set(conn.peer, conn);

    conn.send({ t: "bienvenida", semilla: save.semilla, cambios: save.cambios, host: { id: multi.peer.id, nombre: nombreJugador(), traje: trajeVisible(), x: jugador.pos.x, y: jugador.pos.y, z: jugador.pos.z }, otros });

function actualizarCielo() {
  const dia = (Math.cos(tiempoDia * Math.PI * 2) + 1) / 2, luz = 0.32 + 0.68 * Math.min(1, dia * 1.6);
  escena.background.copy(CIELO_NOCHE).lerp(CIELO_DIA, Math.min(1, dia * 1.4));
  escena.fog.color.copy(escena.background);
  matOpaco.color.setScalar(luz); matAgua.color.setScalar(luz);
  luzAmb.intensity = 0.35 + 0.6 * luz; luzSol.intensity = 0.55 * luz;
  matNube.opacity = 0.45 + 0.4 * luz;
}
function actualizarCamara(dt) {
  const o = ojo(), M = modo();
  const tercera = vista3 && !M.fantasma;
  if (tercera) {
    const d = direccion(), lejos = 4.5 * Math.max(1, nacho.escala);
    camara.position.set(o.x - d.x * lejos, o.y - d.y * lejos + 0.6, o.z - d.z * lejos);
    camara.lookAt(o);
  } else {
    camara.position.copy(o);
    camara.rotation.set(jugador.pitch, jugador.yaw, 0);
  }
  nacho.g.visible = tercera;
  nacho.g.position.copy(jugador.pos);
  nacho.g.rotation.y = jugador.yaw + Math.PI;
  const paso = jugador.mov > 0.5 && jugador.enSuelo ? Math.sin(performance.now() / 90) * 0.6 : 0;
  nacho.p.piernas[0].rotation.x = paso; nacho.p.piernas[1].rotation.x = -paso;
  golpeNacho = Math.max(0, golpeNacho - dt);
  nacho.p.brazos[0].rotation.x = -paso;
  nacho.p.brazos[1].rotation.x = paso - (golpeNacho > 0 ? 1.6 : 0);
  nacho.p.cabeza.rotation.x = -jugador.pitch * 0.6;
}
function actualizarNubes(dt) {
  for (const n of nubes) {
    n.position.x += dt * 0.8;
    const dx = n.position.x - jugador.pos.x, dz = n.position.z - jugador.pos.z;
    if (dx > 120) n.position.x -= 240; else if (dx < -120) n.position.x += 240;

}

};
function guardarCriatura(invocar) {
  const def = leerTaller();
  if (save.criaturas.length >= 12) { avisar("Ya tenés 12 criaturas: borrá alguna para hacer lugar."); return; }
  save.criaturas.push(def);
  marcar(); guardar();
  if (invocar) {
    if (def.equipo === "jefe" && entes.some((e) => e.equipo === "jefe") && !modo().panel) { avisar("Guardada. Ya hay un jefe en el mundo: derrotalo primero."); panelTaller(); return; }
    invocarCriatura(def); cerrarPanel(true);
  } else { avisar(`Guardaste a ${def.nombre}.`); panelTaller(); }
}
$("panel-cuerpo").addEventListener("click", (e) => {
  const b = e.target.closest("[data-acc]");
  if (!b || b.disabled) return;
  const i = b.dataset.acc.indexOf(":"), acc = i < 0 ? b.dataset.acc : b.dataset.acc.slice(0, i), arg = i < 0 ? undefined : b.dataset.acc.slice(i + 1);
  if (ACCIONES[acc]) ACCIONES[acc](arg);
});
$("panel-cuerpo").addEventListener("input", (e) => {
  const o = { "t-tam": "o-tam", "t-vida": "o-vida", "t-vel": "o-vel" }[e.target.id];
  if (o) $(o).textContent = e.target.value;
  if (e.target.id === "buscar-pais") $("destinos").innerHTML = htmlDestinos(e.target.value);
  if (e.target.id === "mi-nombre") { save.nombre = limpiarNombre(e.target.value.trim()).slice(0, 16); if (!e.target.value.trim()) save.nombre = ""; marcar(); }
  if (e.target.id === "codigo-sala") e.target.value = e.target.value.toUpperCase();
});
$("panel-cuerpo").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const acciones = { clave2: "clave", "a-cant": "a-monedas", "a-bloques": "a-bloques", "tp-x": "tp", "tp-z": "tp", "codigo-sala": "sala-unirse" };
  if (acciones[e.target.id]) { e.preventDefault(); ACCIONES[acciones[e.target.id]](); }
});
$("panel-cerrar").addEventListener("click", () => cerrarPanel(true));
$("hud-botones").addEventListener("click", (e) => {
  const b = e.target.closest("[data-hud]");
  if (!b) return;
  ({ tienda: panelTienda, jefes: panelJefes, amigos: panelAmigos, chat: abrirChat, admin: panelAdmin, taller: panelTaller, trajes: panelTrajes, pausa: panelPausa })[b.dataset.hud]();
});
$("barra-items").addEventListener("click", (e) => {
  const b = e.target.closest("[data-ranura]");
  if (!b) return;
  const i = +b.dataset.ranura;
  if (i === ranura && i < 9) { ranuraEdit = i; panelBloques(); } else elegirRanura(i);
});
$("clic").addEventListener("click", () => { $("clic").hidden = true; bloquear(); });

// ================== Controles ==================
const lienzo = renderer.domElement;
lienzo.addEventListener("mousedown", (e) => {
  if (!jugando || pausado || tactil) return;
  if (document.pointerLockElement !== lienzo) { bloquear(); return; }
  if (e.button === 0) apretIzq = true;
  if (e.button === 2) poner();
});
addEventListener("mouseup", (e) => { if (e.button === 0) apretIzq = false; });
lienzo.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== lienzo || pausado) return;
  jugador.yaw -= e.movementX * 0.0024;
  jugador.pitch = clamp(jugador.pitch - e.movementY * 0.0024, -1.55, 1.55);
});
document.addEventListener("pointerlockchange", () => {
  const bloqueado = document.pointerLockElement === lienzo;
  if (bloqueado) $("clic").hidden = true;
  else if (jugando && !pausado) panelPausa();
});
addEventListener("wheel", (e) => { if (jugando && !pausado) elegirRanura(ranura + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea, select")) return;
  if (!jugando) return;
  // El Esc que suelta el mouse también abre la pausa: no lo usamos para cerrarla en el mismo instante
  if (pausado) { if (e.code === "Escape" && !panelFijo && performance.now() - abiertoEn > 400) cerrarPanel(false); return; }
  const k = e.code;
  if (k === "Enter" || k === "NumpadEnter") { e.preventDefault(); abrirChat(); return; }
  teclas[k] = true;
  if (k === "Space") {
    e.preventDefault();
    const ahora = performance.now();
    if (!e.repeat && modo().vuelo && !modo().fantasma && ahora - ultimoEspacio < 300) alternarVuelo();
    if (!e.repeat) ultimoEspacio = ahora;
  }
  if (/^Digit\d$/.test(k)) { const n = +k.slice(5); elegirRanura(n === 0 ? 9 : n - 1); }
  if (k === "KeyT") panelTienda();
  if (k === "KeyJ") panelJefes();
  if (k === "KeyK") panelTrajes();
  if (k === "KeyE") { ranuraEdit = ranura < 9 ? ranura : 0; panelBloques(); }
  if (k === "KeyF") alternarVuelo();
  if (k === "KeyV" || k === "F5") { e.preventDefault(); vista3 = !vista3; }
  if (k === "KeyP" && modo().panel) panelAdmin();
  if (k === "KeyC" && modo().taller) panelTaller();
});
addEventListener("keyup", (e) => { teclas[e.code] = false; });
addEventListener("blur", () => { for (const k in teclas) teclas[k] = false; apretIzq = false; });

// Táctil: mitad izquierda camina, mitad derecha mira
let stick = null, mirada = null;
lienzo.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch" || !jugando || pausado) return;
  if (e.clientX < innerWidth * 0.45 && !stick) {
    stick = { id: e.pointerId, x0: e.clientX, y0: e.clientY };
    $("stick").hidden = false;
    $("stick").style.left = e.clientX + "px"; $("stick").style.top = e.clientY + "px";
    $("stick").firstChild.style.transform = "";
  } else if (!mirada) mirada = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
addEventListener("pointermove", (e) => {
  if (stick && e.pointerId === stick.id) {
    const dx = e.clientX - stick.x0, dy = e.clientY - stick.y0, d = Math.hypot(dx, dy) || 1, m = Math.min(d, 50) / d;
    mov.x = (dx * m) / 50; mov.y = (dy * m) / 50;
    $("stick").firstChild.style.transform = `translate(${dx * m}px, ${dy * m}px)`;
  }
  if (mirada && e.pointerId === mirada.id) {
    jugador.yaw -= (e.clientX - mirada.x) * 0.006;
    jugador.pitch = clamp(jugador.pitch - (e.clientY - mirada.y) * 0.006, -1.55, 1.55);
    mirada.x = e.clientX; mirada.y = e.clientY;
  }
});
function soltarDedo(e) {
  if (stick && e.pointerId === stick.id) { stick = null; mov.x = mov.y = 0; $("stick").hidden = true; }
  if (mirada && e.pointerId === mirada.id) mirada = null;
}
addEventListener("pointerup", soltarDedo);
addEventListener("pointercancel", soltarDedo);
function botonTactil(id, abajo, arriba) {
  const b = $(id);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); if (jugando && !pausado) abajo(); });
  if (arriba) ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => b.addEventListener(ev, arriba));
}
botonTactil("tb-romper", () => { apretIzq = true; }, () => { apretIzq = false; });
botonTactil("tb-poner", poner);
botonTactil("tb-saltar", () => { teclas.Space = true; }, () => { teclas.Space = false; });
botonTactil("tb-bajar", () => { teclas.ShiftLeft = true; }, () => { teclas.ShiftLeft = false; });
botonTactil("tb-volar", alternarVuelo);
botonTactil("tb-vista", () => { vista3 = !vista3; });

addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camara.aspect = innerWidth / innerHeight;
  camara.updateProjectionMatrix();
});
document.addEventListener("visibilitychange", () => { if (document.hidden && sucio) guardar(); });
addEventListener("pagehide", () => { if (sucio) guardar(); if (multi.peer) { try { multi.peer.destroy(); } catch (e) {} } });

// ================== Portada y arranque ==================
const pideClave = () => !!(MODOS[save.modo] && MODOS[save.modo].soloCreador && !creadorOk);
function dibujarModosPortada() {
  $("modos").innerHTML = '<legend>Modo de juego</legend>' + Object.entries(MODOS).map(([k, m]) =>
    `<div class="modo-op"><input type="radio" name="modo" id="m-${k}" value="${k}"${k === save.modo ? " checked" : ""}><label for="m-${k}"><b>${m.nombre}${m.soloCreador ? '<span class="candado">solo el creador</span>' : ""}</b><span>${m.desc}</span></label></div>`).join("");
  $("clave-zona").hidden = !pideClave();
}
$("modos").addEventListener("change", (e) => {
  if (e.target.name !== "modo") return;
  save.modo = e.target.value;
  marcar();
  $("clave-zona").hidden = !pideClave();
  $("clave-error").textContent = "";
  if (!$("clave-zona").hidden) $("clave").focus();
});
function intentarJugar() {
  if (pideClave()) {
    if ($("clave").value.trim() !== CLAVE_CREADOR) { $("clave-error").textContent = "Contraseña incorrecta."; $("clave").select(); return; }
    creadorOk = true;
  }
  empezar();
}
$("clave").addEventListener("keydown", (e) => { if (e.key === "Enter") intentarJugar(); });
function empezar() {
  $("portada").hidden = true;
  $("cargando").hidden = false;
  setTimeout(() => {
    if (!mundoListo) {
      indexarCambios();
      inicio.y = alturaSuelo(inicio.x, inicio.z);
      mundoListo = true;
    }
    jugador.pos.set(inicio.x, inicio.y, inicio.z);
    jugador.vel.set(0, 0, 0);
    jugador.vida = jugador.max;
    jugador.volando = !!modo().fantasma;
    jugador.enPortal = false;
    centroChunks = null;
    gestionarChunks(25);
    construirNacho();
    if (save.gigarex && !entes.some((e) => e.tipo === "gigarex")) spawnGigarex();
    if (save.huevoPlantado && !huevos.length) { const h = save.huevoPlantado; crearHuevo(h.x, h.y, h.z, h.resta); }
    $("cargando").hidden = true;
    $("hud").hidden = false;
    $("tactil").hidden = !tactil;
    jugando = true; pausado = false;
    lugarMostrado = null;
    dibujarHUD();
    if (save.nuevo) {
      save.nuevo = false;
      avisar("¡Bienvenido a Dragon Nacho! Te regalamos 1000 monedas.", 5000);
      avisar(tactil ? "Tocá Tienda para comprar el huevo de Gigarex." : "Apretá T para la tienda y J para los jefes.", 5000);
      avisar("Entrá al portal violeta para viajar por el mundo.", 5000);
      marcar(); guardar();
    }
    if (!tactil) bloquear();
  }, 30);
}
$("jugar").addEventListener("click", intentarJugar);
$("ver-ayuda").addEventListener("click", panelAyuda);
$("ver-reportar").addEventListener("click", panelReportar);
$("hud-cara").src = CARA;
dibujarMonedas();
dibujarModosPortada();
requestAnimationFrame(bucle);

// Vista de muestra (#demo): arranca sola en el modo Nacho con un traje, Gigarex, Arácnix y un jefe, sin tocar la partida guardada
if (demo) {
  save.modo = "nacho"; creadorOk = true; save.traje = "ironman"; save.gigarex = { nivel: 3, xp: 3 }; save.nuevo = false;
  empezar();
  setTimeout(() => {
    vista3 = true; jugador.yaw = Math.PI * 0.85; jugador.pitch = -0.12;
    spawnAracnix();
    const j = invocarJefe(JEFES[0]);
    j.pos.set(jugador.pos.x - Math.sin(jugador.yaw) * 12, 0, jugador.pos.z - Math.cos(jugador.yaw) * 12);
    j.pos.y = alturaSuelo(j.pos.x, j.pos.z);
    crearHuevo(Math.floor(jugador.pos.x) + 1, Math.floor(jugador.pos.y), Math.floor(jugador.pos.z) - 2, 99);
  }, 200);
}
</script>
</body>
